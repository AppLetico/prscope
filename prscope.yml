# Prscope Configuration
# Planning-first workflow with upstream PR inputs

# Local repository to profile and compare against upstream PRs
local_repo: ~/workspace/prscope

# Project context (optional - README is used automatically if not provided)
# project:
#   name: My Project
#   description: |
#     Override description here if README is not sufficient.
#     The LLM will use this instead of the README.

# Upstream repositories to monitor
upstream:
  - repo: openclaw/openclaw

# Sync settings (handles repos with 1000s of PRs)
sync:
  state: merged       # Only look at merged PRs
  max_prs: 10          # Max PRs to fetch per sync (set to 3 for testing)
  fetch_files: true   # Needed for path matching
  since: 90d          # Initial window: last 90 days
  incremental: true   # Only fetch new PRs after first sync
  eval_batch_size: 3  # Max PRs to evaluate per run (set to 3 for testing)

# Scoring thresholds
scoring:
  min_rule_score: 0.3
  min_final_score: 0.5
  keyword_weight: 0.4
  path_weight: 0.6

# LLM configuration (RECOMMENDED for high-quality results)
# Without upstream_eval: rule-based only (more noise)
# With upstream_eval: semantic analysis + "already implemented" detection
upstream_eval:
  enabled: true      # Set to true and add OPENAI_API_KEY to .env
  model: gpt-4o
  temperature: 0.2
  max_tokens: 3000

# Planning mode (Author + Critic)
# author_model / critic_model / memory_model can be any LiteLLM-supported model.
# memory_model: used only for "Preparing codebase memory"; defaults to author_model if omitted.
# Only set ANTHROPIC_API_KEY if you use a Claude model here.
planning:
  # author_model: gpt-4o-mini    # drafts + discovery (default)
  # critic_model: gpt-4o-mini    # critic (default)
  # memory_model: gpt-4o-mini    # optional; codebase memory build (defaults to author_model)
  # Current Google option: set GEMINI_API_KEY in .env
  # author_model: gemini-2.5-flash
  # critic_model: gemini-2.5-flash
  # memory_model: gemini-2.5-flash
  author_model: gpt-4o-mini
  critic_model: gpt-4o-mini
  memory_model: gpt-4o-mini
  # Optional: transient LLM retries (rate limits / overload). See planning.runtime.llm_retry.
  # author_completion_fallback_model: gpt-4o
  # discovery_completion_fallback_model: gpt-4o-mini
  # llm_retry:
  #   enabled: true
  #   max_attempts: 4
  #   initial_delay_seconds: 1.0
  #   max_delay_seconds: 60.0
  #   backoff_multiplier: 2.0
  #   respect_retry_after: true
  author_call_timeout_seconds: 50
  memory_prep_timeout_seconds: 120
  initial_draft_timeout_seconds: 45
  max_adversarial_rounds: 10
  convergence_threshold: 0.05
  output_dir: ./plans
  require_verified_file_references: false
  discovery_tool_rounds: 25        # codebase tool calls during discovery (like Cursor plan mode)
  author_tool_rounds: 25           # codebase tool calls during plan drafting/refinement
  # Optional: codebase tool behavior (grep_code uses ripgrep when rg is on PATH)
  # tools:
  #   grep_backend: auto            # auto | ripgrep | python
  #   ripgrep_command: rg
  #   ripgrep_timeout_seconds: 45
  #   ripgrep_max_columns: 500
  #   ripgrep_respect_ignore_files: true
  #   glob_max_results: 100
  #   read_file_fast_path_max_bytes: 10485760   # <= this size: load whole file in memory; larger: streaming line read (see docs/agent-harness.md)
  #   read_file_max_file_bytes: 1073741824      # refuse read_file above this size (narrow window or use grep_code)
  #   read_file_max_output_chars: 256000        # cap returned read_file content after line windowing (huge single lines)
  #   tool_result_max_chars: 8000    # per-tool JSON cap before artifact offload (.prscope/tool-results/); raise if discovery loses too much inline context
  #   # tool_result_max_chars_by_tool:          # optional overrides (tool name -> chars, min 1024 each)
  #   #   grep_code: 12000
  #   #   read_file: 8000
  #   # Optional: repo-relative path prefixes per tool (omit a tool = no extra restriction)
  #   path_allowlist:
  #     read_file: [src/, tests/]
  #     list_files: [src/, tests/, .]
  #     grep_code: [src/, tests/]
  #     glob_files: [src/, tests/]
  # Context budgeting (initial draft + discovery)
  # author_prompt_completion_reserve_tokens: 4000
  # context_tool_overhead_tokens: 1000
  # token_budget_estimator: heuristic   # heuristic | tiktoken (optional package)
  # discovery_conversation_max_chars: 120000
  # discovery_conversation_max_input_tokens: 0   # omit or 0 = off; set >0 to trim by estimated input tokens
  # discovery_compaction_failure_max: 0           # 0 = unlimited; >0 aborts after N discovery transcript compactions
